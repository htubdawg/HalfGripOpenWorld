# Makes a release when a new version reaches main: tag v<version> and a release "Version <version>" with OpenWorld.zip (the
# OpenWorld/ folder as it is installed to <game>\BepInEx\HalfGripMods\OpenWorld\), as the releases up to 0.27.1 were made by hand.
# The version is mod.json's; bump it (and the README's) in the pull request. A version already tagged is skipped, so merging other
# changes to main makes no release. Run it from the Actions tab (workflow_dispatch) to release main's version by hand.
# The mod is not compiled here: that needs the game's DLLs (the private HalfGripRefs repo); run tools/check.sh before merging.
name: Release

on:
  push:
    branches: [main]
    paths: [OpenWorld/mod.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('OpenWorld/mod.json'))['version'])")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=OpenWorld/mod.json::version '$version' is not x.y.z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged: nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the README states the version
        if: steps.version.outputs.skip == 'false'
        run: |
          version='${{ steps.version.outputs.version }}'
          if ! grep -qF "Version **$version**" README.md || ! grep -qF "Loaded Open World $version" README.md; then
            echo "::error file=README.md::README.md does not give version $version (its 'Version **x.y.z**' and 'Loaded Open World x.y.z' lines)"
            exit 1
          fi

      - name: Zip OpenWorld/
        if: steps.version.outputs.skip == 'false'
        run: |
          zip -r -X -q OpenWorld.zip OpenWorld -x '*.DS_Store'
          unzip -l OpenWorld.zip | tail -1

      - name: Tag and release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ steps.version.outputs.version }}'
          gh release create "v$version" OpenWorld.zip \
            --target "$GITHUB_SHA" \
            --title "Version $version" \
            --generate-notes
