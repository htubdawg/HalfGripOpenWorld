<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whitetail Doe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the deer fills the field; a narrow panel of controls rides over its left edge (below it on a phone). */
:root {
	--bg: #e7e9e1; --field: #cfd6c4; --panel: #f6f7f2; --fg: #22261f; --muted: #626a5c; --line: #c3c9b8;
	--accent: #9a6b42; --accent-fg: #fffaf3; --chip: #e2e6d9;
	--display: "Archivo", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
	--bg: #161a15; --field: #232a21; --panel: #1d221b; --fg: #e4e8dd; --muted: #98a28f; --line: #354032;
	--accent: #c38c5a; --accent-fg: #1b130b; --chip: #2a3227; color-scheme: dark } }
:root[data-theme="dark"] {
	--bg: #161a15; --field: #232a21; --panel: #1d221b; --fg: #e4e8dd; --muted: #98a28f; --line: #354032;
	--accent: #c38c5a; --accent-fg: #1b130b; --chip: #2a3227; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--display); overflow: hidden; }
.app { position: relative; height: 100%; }
#view { position: absolute; inset: 0; background: var(--field); }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.panel {
	position: absolute; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); width: 236px; max-height: calc(100% - 24px); overflow-y: auto;
	background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 14px;
}
h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; }
.sub { margin: 2px 0 0; font: 12px/1.4 var(--mono); color: var(--muted); }
.group { display: flex; flex-direction: column; gap: 6px; }
.label { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips button, .drop {
	font: 500 12px var(--mono); color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 6px;
	padding: 5px 8px; cursor: pointer;
}
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chips button:focus-visible, .drop:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 12px var(--mono); }
input[type="range"] { width: 110px; accent-color: var(--accent); }
.drop { display: block; text-align: center; border-style: dashed; padding: 10px 8px; line-height: 1.4; color: var(--muted); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font: 12px var(--mono); }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
#msg { position: absolute; inset: 0; display: grid; place-items: center; font: 13px var(--mono); color: var(--muted); pointer-events: none; }
@media (max-width: 560px) {
	.panel { top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
		width: auto; max-height: 44%; }
}
</style>

</head>
<body>
<div class="app">
	<div id="view"><div id="msg">Loading the deer…</div></div>
	<aside class="panel" aria-label="Viewer controls">
		<div>
			<h1>Whitetail doe</h1>
			<p class="sub">Open World road hazard · sculpted, 1,600 tris</p>
		</div>
		<div class="group">
			<span class="label">Motion</span>
			<div class="chips" id="motion">
				<button id="m-stand" data-m="stand" aria-pressed="true">stand</button>
				<button id="m-alert" data-m="alert">alert</button>
				<button id="m-graze" data-m="graze">graze</button>
				<button id="m-flag" data-m="flag">flag</button>
				<button id="m-walk" data-m="walk">walk</button>
				<button id="m-gallop" data-m="gallop">gallop</button>
			</div>
		</div>
		<div class="group">
			<span class="label">Coat</span>
			<div class="chips" id="coat">
				<button id="c-summer" data-c="summer" aria-pressed="true">summer</button>
				<button id="c-winter" data-c="winter">winter</button>
				<button id="c-guide" data-c="guide">UV guide</button>
				<button id="c-image" data-c="image" disabled>your texture</button>
			</div>
			<label class="drop" id="drop">Drop a painted texture here, or tap to choose one
				<input type="file" id="file" accept="image/*">
			</label>
		</div>
		<div class="group">
			<span class="label">View</span>
			<div class="row"><label for="wire">Wireframe</label><input type="checkbox" id="wire"></div>
			<div class="row"><label for="pixel">Crunchy pixels</label><input type="checkbox" id="pixel"></div>
			<div class="row"><label for="speed">Speed</label><input type="range" id="speed" min="0" max="2" step="0.05" value="1"></div>
			<div class="row"><label for="spin">Turntable</label><input type="checkbox" id="spin"></div>
		</div>
		<dl class="facts">
			<dt>Shoulder</dt><dd>0.95 m · 3.1 units</dd>
			<dt>Length</dt><dd>1.8 m · 6 units</dd>
			<dt>Bones</dt><dd id="f-bones">–</dd>
			<dt>Triangles</dt><dd id="f-tris">–</dd>
		</dl>
	</aside>
</div>

		mat.needsUpdate = true;
	}
	document.getElementById('coat').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) setCoat(b.dataset.c); });
	function useImage(file) {
		if (!file || !file.type.startsWith('image/')) return;
		const url = URL.createObjectURL(file);
		loader.load(url, t => {
			if (textures.image) textures.image.dispose();
			textures.image = prep(t);
			const b = document.getElementById('c-image'); b.disabled = false;
			setCoat('image');
		});
	}
	document.getElementById('file').addEventListener('change', e => useImage(e.target.files[0]));
	for (const el of [document.getElementById('drop'), view]) {
		el.addEventListener('dragover', e => e.preventDefault());
		el.addEventListener('drop', e => { e.preventDefault(); useImage(e.dataTransfer.files[0]); });
	}
	document.getElementById('pixel').addEventListener('change', () => { for (const t of Object.values(textures)) filter(t); });
	document.getElementById('wire').addEventListener('change', e => { wire.visible = e.target.checked; });

	// poses: absolute local Euler rotations (XYZ); a bone a pose leaves out keeps the bind's zero
	const Q = {};
	const mirror = p => { const o = {}; for (const [k, v] of Object.entries(p)) o[k.replace(/L$/, '#').replace(/R$/, 'L').replace(/#$/, 'R')] = v; return o; };
	const poses = Object.assign({}, D.poses, { walk2: mirror(D.poses.walk1) });
	for (const [name, p] of Object.entries(poses)) {
		Q[name] = {};
		for (const b of list) { const e = p[b.name] || [0, 0, 0]; Q[name][b.name] = new THREE.Quaternion().setFromEuler(new THREE.Euler(e[0], e[1], e[2], 'XYZ')); }
	}
	const rootY = root.position.y;
	let motion = 'stand', t = 0, blend = 1;
	const from = {}; for (const b of list) from[b.name] = new THREE.Quaternion();
	function target(m, time) {
		// a gait is two key poses swung between; a still pose is itself
		if (m === 'walk') { const k = 0.5 - 0.5 * Math.cos(time * 2 * Math.PI * 0.9); return { a: Q.walk1, b: Q.walk2, k, bob: 0.012 * Math.abs(Math.sin(time * 2 * Math.PI * 0.9)) }; }
		if (m === 'gallop') { const ph = time * 2 * Math.PI * 1.9; const k = 0.5 - 0.5 * Math.cos(ph); return { a: Q.gather, b: Q.extend, k, bob: 0.07 * Math.max(0, Math.sin(ph - 0.6)) }; }
		return { a: Q[m], b: Q[m], k: 0, bob: 0 };
	}
	function setMotion(m) {
		for (const b of list) from[b.name].copy(b.quaternion);
		motion = m; blend = 0;
		for (const b of document.querySelectorAll('#motion button')) b.setAttribute('aria-pressed', String(b.dataset.m === m));
	}
	document.getElementById('motion').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMotion(b.dataset.m); });

	const tmp = new THREE.Quaternion();
	const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
	function resize() {
		const w = view.clientWidth, h = view.clientHeight;
		renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
	}
	new ResizeObserver(resize).observe(view); resize();
	scene.background = new THREE.Color(groundColor());
	matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { scene.background = new THREE.Color(groundColor()); });
	new MutationObserver(() => { scene.background = new THREE.Color(groundColor()); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

	setCoat('summer');
	const clock = new THREE.Clock();
	renderer.setAnimationLoop(() => {
		const dt = Math.min(clock.getDelta(), 0.05);
		const speed = parseFloat(document.getElementById('speed').value);
		t += dt * speed * (reduce ? 0.5 : 1);
		blend = Math.min(1, blend + dt * 3.5);
		const g = target(motion, t);
		for (const b of list) {
			tmp.copy(g.a[b.name]).slerp(g.b[b.name], g.k);
			b.quaternion.copy(from[b.name]).slerp(tmp, blend * blend * (3 - 2 * blend));
		}
		root.position.y = rootY + g.bob * blend;
		if (document.getElementById('spin').checked) mesh.rotation.y = wire.rotation.y = mesh.rotation.y + dt * 0.5 * speed;
		controls.update();
		renderer.render(scene, camera);
	});
})();
